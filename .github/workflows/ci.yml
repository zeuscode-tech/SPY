name: SPY checks
on:
  pull_request:
  push:
    branches: [main, feature/spy-2-0-foundation]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The legacy lockfile is currently incomplete; repair it before a clean install.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run type-check
      - run: npm run build:cap
