name: SPY checks
on:
  pull_request:
  push:
    branches: [main, feature/spy-2-0-foundation]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build:cap
