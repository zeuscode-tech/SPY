name: SPY checks
on:
  pull_request:
  push:
    branches: [main, feature/spy-2-0-foundation]
# Temporary repair step: commit generated npm lockfile back to the feature branch.
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The legacy lockfile is currently incomplete; repair it before a clean install.
      - run: npm install --package-lock-only --ignore-scripts
      - name: Persist synchronized lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/spy-2-0-foundation'
        run: |
          git config user.name 'zeuscode-tech'
          git config user.email '180309429+zeuscode-tech@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:feature/spy-2-0-foundation
          fi
      - run: npm ci
      - run: npm run type-check
      - run: npm run build:cap
